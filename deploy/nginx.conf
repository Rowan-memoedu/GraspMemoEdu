server {
    listen 80 default_server;
    server_name 124.221.144.155;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/graspmemoedu-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl default_server;
    server_name 124.221.144.155;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/graspmemoedu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graspmemoedu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GraspMemoEduTLS:1m;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    if ($host != 124.221.144.155) { return 421; }
    # Assets stay behind the application's resource and subject authorization.
    location = /api/training-audio/transcribe {
        client_max_body_size 6m;
        include /etc/nginx/graspmemoedu-access.conf;
        proxy_pass http://127.0.0.1:18768;
        proxy_set_header Host 124.221.144.155;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
    location = /api/help-images {
        client_max_body_size 3m;
        include /etc/nginx/graspmemoedu-access.conf;
        proxy_pass http://127.0.0.1:18768;
        proxy_set_header Host 124.221.144.155;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # Never alias the private data directory into the public web root.
    location ~ ^/(api|guide-assets|subject-guide-assets)/ {
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_comp_level 4;
        gzip_vary on;
        proxy_pass http://127.0.0.1:18768;
        proxy_http_version 1.1;
        proxy_set_header Host 124.221.144.155;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
