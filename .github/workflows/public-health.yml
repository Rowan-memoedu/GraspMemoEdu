name: Public health

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and record availability
        shell: bash
        run: |
          set -euo pipefail
          title='[monitor] GraspMemoEdu 公网不可用'
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "[monitor] GraspMemoEdu 公网不可用") | .number' | head -n 1)
          if python scripts/check_public_health.py; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment '公网 API、前端配置和首页已恢复。'
            fi
          else
            if [ -z "$existing" ]; then
              gh issue create --title "$title" \
                --body '定时公网检查失败；请查看此工作流运行日志以及云端 nginx 和 graspmemoedu 服务。仅记录公开健康状态，不含学生数据。'
            fi
            exit 1
          fi
